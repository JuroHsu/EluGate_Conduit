name: Build installers and release

on:
  push:
    tags:
      - "v*"
  # Run on a branch to build test installers without publishing a release.
  # Run on an existing v* tag to retry that release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: windows-x64
            targets: x86_64-pc-windows-msvc
            args: --bundles nsis,msi
            bundles: src-tauri/target/release/bundle
          - name: macOS universal
            os: macos-latest
            artifact: macos-universal
            targets: aarch64-apple-darwin x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
            bundles: src-tauri/target/universal-apple-darwin/release/bundle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm

      - name: Check package versions and release tag
        run: |
          node --test scripts/check-release-version.test.mjs
          node scripts/check-release-version.mjs

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.targets }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Check and build frontend
        run: npm run build

      - name: Test Rust core
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Build installers
        env:
          # Ad-hoc signing for macOS; this is not Developer ID signing/notarization.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: npm run tauri build -- --ci ${{ matrix.args }} -- --locked

      - name: Save installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ matrix.artifact }}
          path: |
            ${{ matrix.bundles }}/nsis/*.exe
            ${{ matrix.bundles }}/msi/*.msi
            ${{ matrix.bundles }}/dmg/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Check release version
        id: version
        run: node scripts/check-release-version.mjs

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installers-*
          path: release-artifacts
          merge-multiple: true

      - name: Collect installers and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          while IFS= read -r -d '' source; do
            name="$(basename "$source")"
            # Use URL-friendly names before hashing; GitHub normalizes spaces.
            name="${name// /-}"
            test ! -e "release-assets/$name"
            cp -- "$source" "release-assets/$name"
          done < <(find release-artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) -print0)
          test -n "$(find release-assets -maxdepth 1 -name '*.exe' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -name '*.msi' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -name '*.dmg' -print -quit)"
          cd release-assets
          sha256sum -- * > SHA256SUMS.txt

      - name: Create draft, upload assets, then publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" --json isDraft > release-state.json; then
            if [ "$(node -p "JSON.parse(require('fs').readFileSync('release-state.json')).isDraft")" != "true" ]; then
              echo "::error::This release is already public. Publish a new version instead of replacing its installers."
              exit 1
            fi
          else
            flags=()
            if [ "$IS_PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
            gh release create "$TAG_NAME" --verify-tag --draft \
              --title "EluGate Conduit $TAG_NAME" \
              --notes-file .github/release-notes.md "${flags[@]}"
          fi
          gh release upload "$TAG_NAME" release-assets/* --clobber
          gh release edit "$TAG_NAME" --draft=false --prerelease="$IS_PRERELEASE"
          gh release view "$TAG_NAME" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
